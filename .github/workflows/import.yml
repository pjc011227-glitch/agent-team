name: Import Agent Team source
on:
  push:
    paths:
      - '.agent-team-bootstrap.tar.xz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and unpack source archive
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import tarfile
          from pathlib import Path
          source = Path(".agent-team-bootstrap.tar.xz.b64")
          data = base64.b64decode(source.read_text().strip(), validate=True)
          assert hashlib.sha256(data).hexdigest() == "4b45c458ec953627f77861e2b5d53b5698b2ea1313e0bc0c9ff3ac322a528759", "Archive checksum mismatch"
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:xz") as archive:
              files = archive.getmembers()
              assert all(not m.issym() and not m.islnk() and not Path(m.name).is_absolute() and ".." not in Path(m.name).parts for m in files)
              archive.extractall(".", filter="data")
          source.unlink()
          print("Restored", len(files), "project files")
          PY
      - name: Verify application tests
        run: |
          python -m pip install -e ".[test]"
          python -m unittest discover -s tests -v
      - name: Commit project sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GitHub Actions token cannot commit new workflow files.
          # Upload the test workflow separately via the GitHub connector.
          rm -f .github/workflows/tests.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: import Agent Team v0.2 source"
            git push
          fi
