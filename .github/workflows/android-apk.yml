name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    name: Build Android preview APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p android :app:assembleDebug
      - name: Check APK output
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk | tail -n 1
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - name: Stage APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/AgentTeam-Android-v0.1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AgentTeam-Android-v0.1-debug
          path: out/AgentTeam-Android-v0.1-debug.apk
          if-no-files-found: error
      - name: Publish Android preview release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-preview-v0.1
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/AgentTeam-Android-v0.1-debug.apk --clobber
          else
            gh release create "$TAG" out/AgentTeam-Android-v0.1-debug.apk \
              --target "$GITHUB_SHA" \
              --title "Agent Team Android v0.1 (preview)" \
              --notes "Android WebView client for your HTTPS Agent Team Hub. Requires separate server/desktop worker. Test/debug-signed build, not production hardened." \
              --prerelease
          fi
